name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Dist Directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Setup Build Function
        shell: pwsh
        run: |
          @'
          param([string]$Arch, [string]$CmakeArch)
          cmake -B "build-$Arch" -A $CmakeArch
          cmake --build "build-$Arch" --config Release
          Copy-Item "bin/r0-fw-cli.exe" -Destination "dist/r0-fw-cli-windows-$Arch.exe"
          Copy-Item "bin/r0-fw-daemon.exe" -Destination "dist/r0-fw-daemon-windows-$Arch.exe"
          Compress-Archive -Path "bin/*.exe" -DestinationPath "dist/ransom0-firewall-windows-$Arch.zip"
          Remove-Item "bin/*.exe"
          '@ | Set-Content -Path "build_and_package.ps1" -Encoding utf8

      - name: Build amd64
        shell: pwsh
        run: .\build_and_package.ps1 -Arch "amd64" -CmakeArch "x64"

      - name: Build arm64
        shell: pwsh
        run: .\build_and_package.ps1 -Arch "arm64" -CmakeArch "ARM64"

      - name: Build x86
        shell: pwsh
        run: .\build_and_package.ps1 -Arch "x86" -CmakeArch "Win32"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
