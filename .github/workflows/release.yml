name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Executables
        shell: pwsh
        run: |
          Compress-Archive -Path bin/r0-fw-cli.exe, bin/r0-fw-daemon.exe -DestinationPath bin/ransom0-firewall-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/r0-fw-cli.exe
            bin/r0-fw-daemon.exe
            bin/ransom0-firewall-windows-x64.zip
